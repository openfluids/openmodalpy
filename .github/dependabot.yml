version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: monthly
    groups:
      github-actions-updates:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: monthly
    groups:
      uv-updates:
        patterns:
          - "*"
