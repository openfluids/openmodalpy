name: release

on:
  push:
    tags:
      - "v*"
  # Verify the PyPI trusted-publisher match without uploading anything. The probe
  # has to live in this file: PyPI matches on the workflow filename, so a check
  # run from any other workflow would fail for the wrong reason.
  workflow_dispatch:
    inputs:
      verify_only:
        description: "Only verify the trusted-publisher match; publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify-oidc:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_only
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Exchange an OIDC token with PyPI
        run: |
          oidc="$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi" | jq -r '.value')"
          if [ -z "$oidc" ] || [ "$oidc" = "null" ]; then
            echo "could not obtain a GitHub OIDC token" >&2
            exit 1
          fi

          body="$(jq -n --arg t "$oidc" '{token: $t}' \
            | curl -sS -X POST https://pypi.org/_/oidc/mint-token -d @-)"

          # Never print the response verbatim: on success it contains a live
          # PyPI upload token.
          if printf '%s' "$body" | jq -e 'has("token")' >/dev/null; then
            echo "MATCH: PyPI accepted the trusted publisher for this repo/workflow/environment."
            echo "(an upload token was minted and discarded; nothing was published)"
          else
            echo "NO MATCH: PyPI rejected the trusted publisher." >&2
            printf '%s' "$body" | jq -r '.message? // "no message"' >&2
            printf '%s' "$body" | jq -r '.errors[]?.description // empty' >&2
            exit 1
          fi

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run tests
        run: uv run --group test pytest -q

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv run python -c 'import openmodalpy; print(openmodalpy.__version__)')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package version $pkg" >&2
            exit 1
          fi

      - name: Build
        run: uv build

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
