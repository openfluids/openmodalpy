name: Mutation testing

# On demand only: this exercises the full test suite once per surviving
# mutant of the scoped files (see pyproject.toml [tool.mutmut]) and easily
# takes an hour, so it never runs on push or pull_request.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 1 * *" # 03:00 UTC on the 1st of each month

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Mutation run
        run: bash scripts/mutation.sh mutation-report.txt

      # Upload even when the run above fails: a partial report says more about
      # where it stopped than an empty artifact list does.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: mutation-report.txt
          if-no-files-found: warn
