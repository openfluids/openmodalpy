[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openmodalpy"
# Single source of truth: __version__ in src/openmodalpy/__init__.py (see [tool.hatch.version]).
# Keeping it in one place means the release workflow's tag check and the built
# artifact can never disagree about the version.
dynamic = ["version"]
description = "OpenModalPy: Python tools for POD, MPOD, DMD, SPOD, PSD-POD, BSMD, and ST-POD on spatiotemporal data"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [
    { name = "Ricardo Frantz", email = "rasfrantz@gmail.com" },
]
maintainers = [
    { name = "Ricardo Frantz", email = "rasfrantz@gmail.com" },
]
keywords = [
    "POD",
    "MPOD",
    "DMD",
    "SPOD",
    "PSD-POD",
    "BSMD",
    "ST-POD",
    "modal decomposition",
    "spatiotemporal data",
    "fluid dynamics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "h5py>=3.8",
    "tqdm>=4.65",
    "threadpoolctl>=3.0",
    # >=0.2.0: fftkit 0.1.0's `gpu` extra resolved to the source-only `cupy`
    # sdist, so `openmodalpy[gpu]` triggered a local CUDA toolkit compile
    # instead of installing a wheel. 0.2.0 points it at `cupy-cuda12x`.
    # openmodalpy is compatible with later releases: its two FFT call sites
    # pass axis=0 explicitly, so fftkit's axis-default change does not reach
    # them. Locked version is 0.4.0; the suite (220 tests) runs with
    # filterwarnings=error, and tests/test_fft_axis_default.py asserts no
    # AxisDefaultWarning under a full SPOD FFT path.
    "fftkit>=0.2.0",
]

[project.optional-dependencies]
# FFT accelerators are provided by fftkit, which owns backend dispatch.
mkl = ["fftkit[mkl]"]
# fftkit's `gpu` extra is an alias for its CUDA 12 wheel; use fftkit[cuda11]
# directly if you need a CUDA 11 build.
gpu = ["fftkit[gpu]"]
viz3d = ["pyvista>=0.46"]

[project.scripts]
openmodalpy = "openmodalpy.cli:main"

[project.urls]
Homepage = "https://github.com/openfluids/openmodalpy"
Source = "https://github.com/openfluids/openmodalpy"
Tracker = "https://github.com/openfluids/openmodalpy/issues"
Documentation = "https://github.com/openfluids/openmodalpy#readme"
Changelog = "https://github.com/openfluids/openmodalpy/blob/main/CHANGELOG.md"

# Development dependencies as PEP 735 groups; the CI workflows call `uv run --group ...`.
[dependency-groups]
test = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
]
lint = [
    "ruff>=0.1",
    "mypy>=1.18",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.hatch.version]
path = "src/openmodalpy/__init__.py"

[tool.hatch.build]
dev-mode-dirs = ["src"]

# Only the self-contained, generator-backed example configs ship. The excluded ones
# depend on benchmark datasets that live outside the repository.
[tool.hatch.build.targets.sdist]
include = [
    "/src/openmodalpy",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "/src/openmodalpy/examples/cavity.jsonc",
    "/src/openmodalpy/examples/cylinder.jsonc",
    "/src/openmodalpy/examples/cylinder_wake_compressible.jsonc",
    "/src/openmodalpy/examples/jet.jsonc",
    "/src/openmodalpy/examples/jet_small.jsonc",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openmodalpy"]
include = [
    "src/openmodalpy/py.typed",
    "src/openmodalpy/examples/cylinder_wake.jsonc",
    "src/openmodalpy/examples/double_gyre.jsonc",
    "src/openmodalpy/examples/run_benchmarks.jsonc",
    "src/openmodalpy/examples/taylor_green.jsonc",
]

[tool.mypy]
python_version = "3.11"
exclude = ["tests/", "examples/"]
ignore_missing_imports = true
# Every def under src/openmodalpy is annotated, so this is set once globally
# rather than per module. A new file is checked the day it is added, instead
# of staying unchecked until someone remembers to list it.
disallow_untyped_defs = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Any uncaught warning is a failure. Intentional library notices are asserted
# with pytest.warns in the tests that trigger them (never blanket-ignored).
filterwarnings = ["error"]
# Evidence taxonomy:
# every test that recomputes the implementation's own formula in the
# implementation's own order MUST carry `characterization`; tests that derive
# expectations from independent mathematics or manufactured closed forms MAY
# carry `oracle`. Counts are machine-readable:
#   uv run pytest -q -m characterization --collect-only | tail -1
#   uv run pytest -q -m oracle --collect-only | tail -1
markers = [
    "characterization: refactoring guard that replays the library's own formula; catches typos and drift, not specification misunderstandings",
    "oracle: expectation built from independent mathematics (closed form, conservation law, or cross-implementation comparison)",
]

[tool.coverage.report]
# Ratchet floor, enforced identically by local runs and CI (the workflow
# carries no inline --cov-fail-under). Measured 2026-08-22 on Linux, CPython
# 3.13: 74% total (6278 statements, 1605 missed); floor sits 2 points under
# the measurement to absorb interpreter drift (CI measures on 3.14) and
# dependency-coverage noise while still catching any real regression.
# Ratchet policy lives in CONTRIBUTING.md ("Coverage floor ratchet").
fail_under = 72
